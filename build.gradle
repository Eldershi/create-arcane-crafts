import groovy.json.JsonOutput
import groovy.json.JsonSlurper

buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7.38' }
}

plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.42'
}
apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version
base { archivesName = 'create-arcane-crafts' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

// The acceptance contracts deliberately compile only dependency-free production
// helpers. A fresh clone does not need the ignored WebGL history or a game install.
sourceSets {
    releaseVerification {
        java {
            srcDirs = ['src/main/java', 'tools']
            include 'dev/expedition/arcane/client/ScrollRevealMotion.java'
            include 'dev/expedition/arcane/client/ChamberItemMotion.java'
            include 'dev/expedition/arcane/client/ChamberResearchSoundPlan.java'
            include 'dev/expedition/arcane/chamber/ResearchLottery.java'
            include 'VerifyChamberSounds.java'
            include 'VerifyReleaseInvariants.java'
        }
        resources.srcDirs = []
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // Create publishes SRG refmaps; remap them for the named dev environment.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                arcane_industry { source sourceSets.main }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

mixin {
    add sourceSets.main, 'arcane_industry.refmap.json'
    config 'arcane_industry.mixins.json'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net'; content {
        includeGroup 'com.simibubi.create'
        includeGroup 'net.createmod.ponder'
        includeGroup 'dev.engine-room.flywheel'
    } }
    maven { url = 'https://maven.ithundxr.dev/mirror'; content {
        includeGroup 'com.tterrag.registrate'
    } }
    maven {
        url = 'https://maven.dragons.plus/releases'
        content { includeGroupByRegex 'plus\\.dragons.*' }
        // Use the published JARs without upstream development-only variant dependencies.
        metadataSources { mavenPom(); artifact(); ignoreGradleMetadataRedirection() }
    }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei' } }
    maven { url = 'https://maven.theillusivec4.top'; content { includeGroup 'top.theillusivec4.curios' } }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'; content {
        includeGroup 'software.bernie.geckolib'
    } }
    maven { url = 'https://maven.kosmx.dev'; content { includeGroup 'dev.kosmx.player-anim' } }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/'; content {
        includeGroup 'org.spongepowered'
    } }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // 0.8.5's AP crashes on dependency field descriptors (TypeHandleASM).
    // 0.8.7 fixes the build-time processor; Forge's runtime Mixin stays untouched.
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor' 

    implementation(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim")) { transitive = false }
    implementation(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")) { transitive = false }
    compileOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")) { transitive = false }
    runtimeOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")) { transitive = false }
    implementation(fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")) { transitive = false }
    implementation 'io.github.llamalad7:mixinextras-forge:0.4.1'

    implementation(fg.deobf("plus.dragons.createenchantmentindustry:create-enchantment-industry-${minecraft_version}:${cei_version}")) { transitive = false }
    implementation(fg.deobf("plus.dragons.createdragonsplus:create-dragons-plus-${minecraft_version}:${dragons_plus_version}")) { transitive = false }
    implementation(fg.deobf("maven.modrinth:irons-spells-n-spellbooks:${irons_spellbooks_version_id}")) { transitive = false }
    implementation(fg.deobf("maven.modrinth:irons-lib:${irons_lib_version_id}")) { transitive = false }
    implementation(fg.deobf("maven.modrinth:sophisticated-backpacks:${sophisticated_backpacks_version_id}")) { transitive = false }
    implementation(fg.deobf("maven.modrinth:sophisticated-core:${sophisticated_core_version_id}")) { transitive = false }
    implementation(fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")) { transitive = false }
    implementation(fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")) { transitive = false }
    implementation(fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${player_animator_version}")) { transitive = false }
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")) { transitive = false }
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")) { transitive = false }
    runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")) { transitive = false }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// MixinGradle 0.7.38 writes these AP products outside destinationDirectory.
// Its doLast also copies the raw refmap to the configured resource name.
// Declare all three as compile outputs so FROM-CACHE restores the named refmap
// consumed by addMixinsToJar and the extra mappings consumed by reobfJar.
// Keep the plugin's paths/content unchanged; do not disable compilation caching.
tasks.named('compileJava', JavaCompile).configure {
    outputs.file(provider { new File(temporaryDir, "${name}-refmap.json") })
            .withPropertyName('mixinAnnotationProcessorRefmap')
    outputs.file(provider { new File(temporaryDir, "${name}-mappings.tsrg") })
            .withPropertyName('mixinAnnotationProcessorMappings')
    outputs.file(provider { new File(temporaryDir, sourceSets.main.ext.refMap.toString()) })
            .withPropertyName('mixinPackagedRefmap')
}

// Keep the source resource readable while connecting it to the AP-generated refmap.
// This also works with the prototype resource, which predates an explicit refmap key.
tasks.named('processResources', ProcessResources).configure {
    inputs.property 'mixinRefmap', 'arcane_industry.refmap.json'
    doLast {
        File config = new File(destinationDir, 'arcane_industry.mixins.json')
        def document = new JsonSlurper().parse(config)
        document.refmap = 'arcane_industry.refmap.json'
        config.setText(JsonOutput.prettyPrint(JsonOutput.toJson(document)) + '\n', 'UTF-8')
    }
}

def releaseManifest = [
            'Specification-Title': 'Create: Arcane Crafts',
            'Specification-Vendor': 'Eldershi',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Eldershi',
            'MixinConfigs': 'arcane_industry.mixins.json'
]
def prototypeClasses = [
        'dev/expedition/arcane/testing/**',
        'dev/expedition/arcane/chamber/ChamberTests*',
        'dev/expedition/arcane/chamber/ChamberInteractionRulesTests*',
        'dev/expedition/arcane/chamber/ChamberDisplayHitTests*',
        'dev/expedition/arcane/chamber/ResearchPresentationTests*',
        'dev/expedition/arcane/chamber/ResearchVisualFixture*',
        'dev/expedition/arcane/client/PrototypeScreenshotRequests*',
        'dev/expedition/arcane/client/jei/PrototypeJeiRequests*',
        'dev/expedition/arcane/client/jei/JeiPrototypeVerification*',
        'dev/expedition/arcane/client/jei/NativeAssemblyDisplayNetworkTests*'
]
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from('LICENSES') { into 'LICENSES' }
}
tasks.named('jar', Jar).configure {
    manifest.attributes(releaseManifest)
    prototypeClasses.each { exclude it }
    finalizedBy 'reobfJar'
}

// Explicitly requested development artifact; normal build publishes only the
// production JAR and its sources. Never install both JARs in the same instance.
tasks.register('prototypeJar', Jar) {
    group = 'build'
    description = 'Builds an opt-in QA JAR with prototype commands and screenshot fixtures.'
    archiveClassifier = 'prototype'
    from sourceSets.main.output
    manifest.attributes(releaseManifest)
    finalizedBy 'reobfPrototypeJar'
}
reobf { prototypeJar {} }

tasks.register('verifyReleaseInvariants', JavaExec) {
    group = 'verification'
    description = 'Checks timing, C2 motion, quaternions, research lottery and sound replay without Minecraft.'
    dependsOn tasks.named('releaseVerificationClasses')
    classpath = sourceSets.releaseVerification.runtimeClasspath
    mainClass = 'dev.expedition.arcane.client.VerifyReleaseInvariants'
    args layout.buildDirectory.file('reports/release-invariants.json').get().asFile.absolutePath
}

tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Checks production mappings, metadata, licenses, resource boundaries and absence of QA/dependency payloads.'
    dependsOn 'reobfJar'
    doLast {
        File artifact = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def checked = []
        def require = { boolean valid, String contract ->
            if (!valid) throw new GradleException(contract)
            checked.add(contract)
        }
        new java.util.jar.JarFile(artifact).withCloseable { jar ->
            def names = jar.entries().collect { it.name }
            require(jar.manifest.mainAttributes.getValue('MixinConfigs') == 'arcane_industry.mixins.json',
                    'Release JAR declares its MixinConfigs manifest entry')
            require(jar.manifest.mainAttributes.getValue('Implementation-Version') == project.version.toString(),
                    'Manifest implementation version matches Gradle version')
            ['arcane_industry.mixins.json', 'arcane_industry.refmap.json'].each { entry ->
                require(jar.getEntry(entry) != null, "Release JAR contains ${entry}")
            }
            // This class calls a vanilla override through the upstream menu.
            // Its production invocation must use SRG after reobfJar.
            def bridge = jar.getEntry('dev/expedition/arcane/compat/NativeAnvilBridge$SnapshotMenu.class')
            require(bridge != null && new String(jar.getInputStream(bridge).bytes,
                    java.nio.charset.StandardCharsets.ISO_8859_1).contains('m_6640_'),
                    'Native anvil bridge uses the reobfuscated production createResult name')
            def readText = { String entry ->
                require(jar.getEntry(entry) != null, "Release JAR contains ${entry}")
                jar.getInputStream(jar.getEntry(entry)).getText('UTF-8')
            }
            def toml = readText('META-INF/mods.toml')
            def modVersion = toml =~ /(?m)^version\s*=\s*"([^"]+)"/
            require(modVersion.find() && modVersion.group(1) == project.version.toString(),
                    'mods.toml version matches Gradle version')
            require(toml.contains('modId="arcane_industry"'), 'Stable save namespace is arcane_industry')
            def mixins = new JsonSlurper().parseText(readText('arcane_industry.mixins.json'))
            require(mixins.refmap == 'arcane_industry.refmap.json', 'Mixin configuration names the generated refmap')
            ((mixins.mixins ?: []) + (mixins.client ?: [])).each { name ->
                require(names.contains("${mixins.package}.${name}".replace('.', '/') + '.class'),
                        "Mixin target class is packaged: ${name}")
            }
            // Catch damaged or accidentally copied development JSON in resources.
            names.findAll { it.endsWith('.json') }.each { entry ->
                new JsonSlurper().parseText(jar.getInputStream(jar.getEntry(entry)).getText('UTF-8'))
            }
            checked.add('Every packaged JSON resource parses')
            ['LICENSE.md', 'THIRD_PARTY_NOTICES.md'].each { entry ->
                require(readText(entry) == file(entry).getText('UTF-8'), "Packaged ${entry} matches the maintained notice")
            }
            fileTree('LICENSES').files.each { source ->
                String entry = 'LICENSES/' + file('LICENSES').toPath().relativize(source.toPath()).toString().replace('\\', '/')
                require(jar.getEntry(entry) != null && Arrays.equals(source.bytes, jar.getInputStream(jar.getEntry(entry)).bytes),
                        "Packaged upstream license matches ${entry}")
            }
            def originals = [
                    'block/casing.png', 'block/core_idle.png', 'block/core_active.png', 'block/core_super.png',
                    'entity/chamber/arcane_runes_active.png', 'entity/chamber/arcane_runes_active_s.png',
                    'entity/chamber/arcane_runes_super.png', 'entity/chamber/arcane_runes_super_s.png'
            ].collect { 'assets/arcane_industry/textures/' + it }.toSet()
            require(names.findAll { it.endsWith('.png') }.toSet() == originals,
                    'Exactly the eight original PNG textures are distributed')
            require(!names.any { it ==~ /(?i).+\.(jar|ogg|wav|mp3|mp4|zip|nbt|mca|mcr|db|sqlite)/ },
                    'No nested dependency, copied audio, world or account payload is distributed')
            require(!names.any { it ==~ /(?i)(art|instance|run|testing|outputs|work|\.git|\.gradle|\.aws|\.codex)\/.*/ },
                    'No local development directories are distributed')
            require(!names.any { it.endsWith('.class') && !it.startsWith('dev/expedition/arcane/') },
                    'All packaged classes belong to this addon')
            def qaPaths = names.findAll { name ->
                prototypeClasses.any { pattern ->
                    org.apache.tools.ant.types.selectors.SelectorUtils.matchPath(pattern, name)
                }
            }
            require(qaPaths.isEmpty(), 'Production JAR excludes QA commands, test suites and screenshot fixtures')
        }
        def sha256 = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
        File report = layout.buildDirectory.file('reports/release-jar.json').get().asFile
        report.parentFile.mkdirs()
        report.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                status: 'PASS', artifact: artifact.name, version: project.version.toString(),
                sha256: sha256, sizeBytes: artifact.length(), checks: checked
        ])) + '\n', 'UTF-8')
        logger.lifecycle("Production JAR acceptance: ${checked.size()} checks passed; SHA-256 ${sha256}")
    }
}
tasks.named('check').configure { dependsOn 'verifyReleaseInvariants', 'verifyReleaseJar' }
